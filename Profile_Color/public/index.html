<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/tailwind_Output.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-200 w-[100vw] h-[100vh] flex  flex-col gap-9 items-center justify-center ">

        <div class="Box_center  text-xl bg-white  min-w-[270px] h-[500px] relative   flex  flex-col items-center justify-between rounded-xl md:min-w-1/4 md:w-2/6  xl:min-w-[300px] xl:max-w-[600px] xl:text-2xl ">
            
                <div class="InFoBox w-full h-1/4 flex  items-center justify-center bg-primary  rounded-xl rounded-b-[0px] relative ">
                    <div class="InFo-Items absolute top-1/2 flex flex-col justify-center items-center">
                        <img class="rounded-full size-32 text-primary" src="assets/photos/my.png" alt="">
                        <p class="name text-primary">sajad zare</p>
                        <p class="aboutMe">MidLevel veb developer</p>
                    </div>
                </div>
                <div class="FollowingInfo_Box flex  justify-around items-center  w-full h-2/4   ">
                    <div class="left_Item flex flex-col items-center  h-2/5 gap-[15%]">
                        <p>1.6k</p>
                        <p class="text-primary">Followers</p>
                        <button class="bg-primary text-whitebg-white text-amber-50  rounded-4xl pt-2.5 pb-2.5 pl-8 pr-8 " type="button">Follow</button>
                    </div>
                    <div class="Right_Item flex flex-col items-center h-2/5 gap-[15%]">
                        <p>852</p>
                        <p class="text-primary">Following</p>
                        <button class="bg-white border-4 border-primary   text-primary   rounded-4xl pt-2 pb-2 pl-5 pr-5 " type="button">Messege</button>
                    </div>
                </div>
               
        </div>

        <div class="colors-Box h-1/12 flex items-center min-w-[270px] bg-white justify-around rounded-sm  md:min-w-1/4 md:w-2/6  xl:min-w-[300px] xl:max-w-[600px] ">
            <div class="colors size-10 rounded-4xl border-8 border-black border-dashed " style="background-color: red;" data-color="red"></div>
            <div class="colors size-10 rounded-4xl border-8 border-black border-dashed " style="background-color: rgb(255, 0, 170);" data-color="rgb(255, 0, 170)"></div>
            <div class="colors size-10 rounded-4xl border-8 border-black border-dashed " style="background-color: pink ;" data-color="pink"></div>
            <div class="colors size-10 rounded-4xl border-8 border-black border-dashed " style="background-color: orangered;" data-color="orangered"></div>
            <div class="colors size-10 rounded-4xl border-8 border-black border-dashed " style="background-color: yellowgreen;" data-color="yellowgreen"></div>
            <div class="colors size-10 rounded-4xl border-8 border-black border-dashed " style="background-color: purple ;" data-color="purple"></div>
        </div>
        
    <script src="js/script.js"></script>
</body>
</html>
