<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/tailwind_Output.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class=" w-[100vw] h-[100vh] bg-green-300 flex items-center justify-center m-0 p-0">
    <div class="_container size-5/8 flex flex-col items-center min-h-[300px]   rounded-2xl md:min-h-[447px]  xl:w-1/4 ">
        <div class="NameBook_input  min-w-11/12 h-1/5 ">
            <p class="text-xl">Title:</p>
            <input  type="text" class="w-full h-2/4 rounded-sm border-hidden bg-amber-50 " id="Title">
        </div>
        <div class="Auther_input min-w-11/12 h-1/5 ">
            <p class="text-xl">Auther:</p>
            <input type="text" class="w-full h-2/4 rounded-sm border-hidden bg-amber-50" id="Auther">
        </div>
        <div class="Year_input min-w-11/12 h-1/5 ">
            <p class="text-xl">Year:</p>
            <input type="text" class="w-full h-2/4 rounded-sm border-hidden bg-amber-50" id="Year">
        </div>
        <div class="submit-btn min-w-11/12 h-1/5 ">
            <button type="submit" class="w-full h-2/4 rounded-sm border-hidden bg-blue-400 " id="Button" >Add Book Data</button>
        </div>


        <div class="w-full mt-5 bg-green-400 rounded-sm ">
            <div class="Infos_text flex items-center justify-around  mb-1">
                <div class="Title">
                    <p class="">Title</p>
                </div>
                <div class="Auther flex justify-center items-center">
                    <p class="">Auther</p>
                </div>
                <div class="Year flex justify-center items-center">
                    <p class="">Year</p>
                </div>
            </div>
        </div>



        <div class="Info_Books w-full h-1/5 bg-green-400 rounded-sm  ">
           
            <div class="Dynamic_Item mb-0.5 flex justify-around items-center bg-gray-200 ">
                
                <p class="w-1/3 flex items-center justify-center">sajad zare</p>
                <p class="w-1/3 flex items-center justify-center">me</p>
                <p class="w-1/3 flex items-center justify-center">1384</p>
            </div>
        </div>
    </div>
     

    <script src="js/script.js"></script>
</body>
</html>
