<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/tailwind_Output.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="w-[100vw] bg-black h-[100vh] flex flex-col items-center justify-center">
    <div class="animate-ping"></div>
    <p id="output" class="text-white md:mb-12 md:text-3xl">Start Writing</p>
    <div class="Keyboard_Box flex flex-col   w-11/12 h-3/12   rounded-sm gap-0  md:w-11/12 md:h-4/12 md:gap-2 xl:font-bold xl:text-2xl 2xl:w-3/4">
        <div class=" keyboard-rows row-1__keybord h-[30%] flex  gap-0.5   md:font-bold ">
            <div class="w-[6%] a h-11/12 bg-red-500 rounded-lg flex items-center justify-center"  id="`">`</div>
            <div class="w-[6%] h-11/12 bg-red-500 rounded-lg flex items-center justify-center"  id="1">1</div>
            <div class="w-[6%] h-11/12 bg-red-500 rounded-lg flex items-center justify-center"  id="2">2</div>
            <div class="w-[6%] h-11/12 bg-red-500 rounded-lg flex items-center justify-center"  id="3">3</div>
            <div class="w-[6%] h-11/12 bg-red-500 rounded-lg flex items-center justify-center"  id="4">4</div>
            <div class="w-[6%] h-11/12 bg-red-500 rounded-lg flex items-center justify-center"  id="5">5</div>
            <div class="w-[6%] h-11/12 bg-red-500 rounded-lg flex items-center justify-center"  id="6">6</div>
            <div class="w-[6%] h-11/12 bg-red-500 rounded-lg flex items-center justify-center"  id="7">7</div>
            <div class="w-[6%] h-11/12 bg-red-500 rounded-lg flex items-center justify-center"  id="8">8</div>
            <div class="w-[6%] h-11/12 bg-red-500 rounded-lg flex items-center justify-center"  id="9">9</div>
            <div class="w-[6%] h-11/12 bg-red-500 rounded-lg flex items-center justify-center"  id="0">0</div>
            <div class="w-[6%] h-11/12 bg-red-500 rounded-lg flex items-center justify-center"  id="-">-</div>
            <div class="w-[6%] h-11/12 bg-red-500 rounded-lg flex items-center justify-center"  id="=">=</div>
            <div class="w-[6%] h-11/12 bg-red-500 rounded-lg flex items-center justify-center grow" id="Backspace"> Backspace</div>
        </div>
        <div class=" keyboard-rows row-2__keybord  h-[30%] flex gap-0.5  md:font-bold  ">
            <div class="w-[6%] h-11/12 bg-amber-400 rounded-lg flex items-center justify-center grow" id="Tab">Tab</div>
            <div class="w-[6%] h-11/12 bg-amber-400 rounded-lg flex items-center justify-center" id="q">q</div>
            <div class="w-[6%] h-11/12 bg-amber-400 rounded-lg flex items-center justify-center" id="w">w</div>
            <div class="w-[6%] h-11/12 bg-amber-400 rounded-lg flex items-center justify-center" id="e">e</div>
            <div class="w-[6%] h-11/12 bg-amber-400 rounded-lg flex items-center justify-center" id="r">r</div>
            <div class="w-[6%] h-11/12 bg-amber-400 rounded-lg flex items-center justify-center" id="t">t</div>
            <div class="w-[6%] h-11/12 bg-amber-400 rounded-lg flex items-center justify-center" id="y">y</div>
            <div class="w-[6%] h-11/12 bg-amber-400 rounded-lg flex items-center justify-center" id="u">u</div>
            <div class="w-[6%] h-11/12 bg-amber-400 rounded-lg flex items-center justify-center" id="i">i</div>
            <div class="w-[6%] h-11/12 bg-amber-400 rounded-lg flex items-center justify-center" id="o">o</div>
            <div class="w-[6%] h-11/12 bg-amber-400 rounded-lg flex items-center justify-center" id="p">p</div>
            <div class="w-[6%] h-11/12 bg-amber-400 rounded-lg flex items-center justify-center" id="]">[</div>
            <div class="w-[6%] h-11/12 bg-amber-400 rounded-lg flex items-center justify-center grow" id="\">|</div>
        </div>
        <div class=" keyboard-rows row-3__keybord h-[30%] flex gap-0.5  md:font-bold  ">
            <div class="w-[15%] h-11/12 bg-green-400 rounded-lg flex items-center justify-center grow" id="CapsLock">lock-Keyboard</div>
            <div class="w-[6%] h-11/12 bg-green-400 rounded-lg flex items-center justify-center" id="a">a</div>
            <div class="w-[6%] h-11/12 bg-green-400 rounded-lg flex items-center justify-center" id="s">s</div>
            <div class="w-[6%] h-11/12 bg-green-400 rounded-lg flex items-center justify-center" id="d">d</div>
            <div class="w-[6%] h-11/12 bg-green-400 rounded-lg flex items-center justify-center" id="f">f</div>
            <div class="w-[6%] h-11/12 bg-green-400 rounded-lg flex items-center justify-center" id="g">g</div>
            <div class="w-[6%] h-11/12 bg-green-400 rounded-lg flex items-center justify-center" id="h">h</div>
            <div class="w-[6%] h-11/12 bg-green-400 rounded-lg flex items-center justify-center" id="j">j</div>
            <div class="w-[6%] h-11/12 bg-green-400 rounded-lg flex items-center justify-center" id="k">k</div>
            <div class="w-[6%] h-11/12 bg-green-400 rounded-lg flex items-center justify-center" id="l">l</div>
            <div class="w-[6%] h-11/12 bg-green-400 rounded-lg flex items-center justify-center" id=";">;</div>
            <div class="w-[6%] h-11/12 bg-green-400 rounded-lg flex items-center justify-center" id="'">"</div>
            <div class="w-[8%] h-11/12 bg-green-400 rounded-lg flex items-center justify-center grow" id="Enter">Enter</div>
        </div>
        <div class=" keyboard-rows row-4__keybord h-[30%] flex gap-[3px]   md:font-bold  ">
            <div class="w-[12%] h-11/12 bg-blue-600 rounded-lg flex items-center justify-center grow" id="Shift">Shift</div>
            <div class="w-[6%] h-11/12 bg-blue-600 rounded-lg flex items-center justify-center" id="z">z</div>
            <div class="w-[6%] h-11/12 bg-blue-600 rounded-lg flex items-center justify-center" id="x">x</div>
            <div class="w-[6%] h-11/12 bg-blue-600 rounded-lg flex items-center justify-center" id="c">c</div>
            <div class="w-[6%] h-11/12 bg-blue-600 rounded-lg flex items-center justify-center" id="v">v</div>
            <div class="w-[6%] h-11/12 bg-blue-600 rounded-lg flex items-center justify-center" id="b">b</div>
            <div class="w-[6%] h-11/12 bg-blue-600 rounded-lg flex items-center justify-center" id="n">n</div>
            <div class="w-[6%] h-11/12 bg-blue-600 rounded-lg flex items-center justify-center" id="m">m</div>
            <div class="w-[6%] h-11/12 bg-blue-600 rounded-lg flex items-center justify-center" id=",">,</div>
            <div class="w-[6%] h-11/12 bg-blue-600 rounded-lg flex items-center justify-center" id=".">.</div>
            <div class="w-[6%] h-11/12 bg-blue-600 rounded-lg flex items-center justify-center" id="/">/</div>
            <div class="w-[12%] h-11/12 bg-blue-600 rounded-lg flex items-center justify-center grow" id="Shift">Shift</div>
        </div>
        <div class=" keyboard-rows row-5__keybord h-[30%] flex gap-0.5  md:font-bold  ">
            <div class="w-[13%] h-full bg-pink-500 rounded-lg flex items-center justify-center" id="Control">Ctrl</div>
            <div class="w-[13%] h-full bg-pink-500 rounded-lg flex items-center justify-center" id="Alt">Alt</div>
            <div class="w-[13%] h-full bg-pink-500 rounded-lg flex items-center justify-center grow" id="Space"><div class="w-1/4 h-1 bg-purple-500"></div></div>
            <div class="w-[13%] h-full bg-pink-500 rounded-lg flex items-center justify-center" id="Alt">Alt</div>
            <div class="w-[13%] h-full bg-pink-500 rounded-lg flex items-center justify-center" id="Control">Ctrl</div>
        </div>

    </div>
     <!-- animate-ping -->


    <script src="js/script.js"></script>
</body>
</html>
